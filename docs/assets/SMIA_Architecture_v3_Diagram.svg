<line x1="458" y1="468" x2="432" y2="468" stroke="#5B6178" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="238" y1="468" x2="210" y2="468" stroke="#5B6178" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="340" y="524" font-size="10" fill="#888780" text-anchor="middle">Gray = external / infrastructure, purple = compute, amber = deterministic intelligence, teal = state, coral = human review loop</text>
