<rect x="48" y="440" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="128" y="462" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Repo dispatch</text>
